name: Website

on:
  push:
    branches: [main]
    paths: ["site/**", "CHANGELOG.md", "tools/site/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Pages needs a public repository on the free plan
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # the What's new page renders the changelog
      - run: cp CHANGELOG.md site/
      # release notes in the HTML, version in the structured data, llms-full.txt and sitemap.xml
      - run: node tools/site/build.mjs site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
