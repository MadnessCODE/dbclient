name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, rust: x86_64-pc-windows-msvc }
          - { os: windows-latest, target: aarch64-pc-windows-msvc, rust: aarch64-pc-windows-msvc }
          - { os: macos-latest, target: universal-apple-darwin, rust: "aarch64-apple-darwin,x86_64-apple-darwin" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.target }}

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: DB Client v__VERSION__ (beta)
          releaseBody: |
            **Windows:** `x64-setup.exe` for most PCs, `arm64-setup.exe` for Windows on ARM (Snapdragon, Surface Pro X…).
            **macOS:** `universal.dmg` runs on Apple Silicon and Intel Macs (macOS 11+).

            Installed apps update themselves.

            The installers aren't code-signed yet:
            - Windows SmartScreen may warn: click **More info** → **Run anyway**.
            - macOS blocks the first launch: open the app once, then go to **System Settings → Privacy & Security** and click **Open Anyway**.
          releaseDraft: true
          # Updater artifacts need the signing key, so only release builds create them.
          args: --target ${{ matrix.target }} --config src-tauri/tauri.release.conf.json
