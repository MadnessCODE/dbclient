name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc, aarch64-pc-windows-msvc]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.target }}

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: DB Client v__VERSION__ (beta)
          releaseBody: |
            Download the installer below and run it: `x64-setup.exe` for most PCs, `arm64-setup.exe` for Windows on ARM (Snapdragon / Surface Pro X and similar). Installed apps update themselves.

            The installer isn't code-signed yet, so Windows SmartScreen may warn: click **More info** → **Run anyway**.
          releaseDraft: true
          # Updater artifacts need the signing key, so only release builds create them.
          args: --target ${{ matrix.target }} --config src-tauri/tauri.release.conf.json
