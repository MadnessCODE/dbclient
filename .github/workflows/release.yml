name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, rust: x86_64-pc-windows-msvc }
          - { os: windows-latest, target: aarch64-pc-windows-msvc, rust: aarch64-pc-windows-msvc }
          - { os: macos-latest, target: universal-apple-darwin, rust: "aarch64-apple-darwin,x86_64-apple-darwin" }
          # 22.04 keeps the glibc requirement low enough for older distributions
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, rust: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, rust: aarch64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config rpm

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.target }}

      - run: npm ci

      # Release notes: this version's section of CHANGELOG.md plus the download instructions
      - name: Release notes
        id: notes
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          notes=$(awk -v v="$v" '/^## /{p=($2==v); next} p' CHANGELOG.md)
          if [ -z "$(echo "$notes" | tr -d '[:space:]')" ]; then
            echo "::error::CHANGELOG.md has no section for $v"
            exit 1
          fi
          {
            echo "body<<RELEASE_NOTES_EOF"
            echo "$notes"
            echo
            cat .github/release-footer.md
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: DB Client v__VERSION__ (beta)
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          # Updater artifacts need the signing key, so only release builds create them.
          args: --target ${{ matrix.target }} --config src-tauri/tauri.release.conf.json
