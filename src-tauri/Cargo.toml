[package]
name = "dbclient"
version = "0.1.0"
description = "Desktop database client"
authors = ["MadnessCODE"]
license = "MIT"
repository = "https://github.com/MadnessCODE/dbclient"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dbclient_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Tests against local dev databases (src/dev_tests.rs, not in the repository)
dev-tests = []

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "mysql"] }
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "time", "sync", "net", "io-util"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
thiserror = "2.0.21"
russh = { version = "0.64", default-features = false, features = ["ring", "rsa", "flate2"] }
tauri-plugin-notification = "2"
rust_xlsxwriter = "0.99.1"
flate2 = "1"
csv = "1.4.0"
calamine = "0.36.1"
encoding_rs = "0.8.42"
encoding_rs_io = "0.1.8"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Passwords live in the OS keychain: Windows Credential Manager / macOS Keychain / Linux Secret Service
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust", "vendored"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
